services:
  lumiere:
    build: .
    image: lumiere:latest
    container_name: lumiere
    restart: unless-stopped
    ports:
      - '8484:8484'
    environment:
      TZ: Europe/Paris
      # Clé TMDB (indispensable : le catalogue en vient ; configurable aussi depuis l'interface) :
      # TMDB_API_KEY: votre_cle_tmdb
      # Extensions Stremio qui fournissent les fichiers (par ordre de préférence) :
      # STREMIO_ADDON_URLS: https://st.111477.xyz/manifest.json,https://autre.extension/manifest.json
    volumes:
      # Base de données, caches (affiches, sous-titres) et paramètres.
      - ./data:/data
      # Bibliothèque : films et séries téléchargés.
      - ./media:/media
